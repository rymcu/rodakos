name: RodakOS Site Pages
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'contracts/**'
      - 'tools/build_site_data.py'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'contracts/**'
      - 'tools/build_site_data.py'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# PR builds supersede each other; a production Pages deploy must not be cancelled mid-flight.
concurrency:
  group: docs-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build RodakOS static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Refresh protocol fixtures and run protocol lab tests
        run: |
          python -I tools/build_site_data.py
          node site/tests/protocol-logic.test.mjs

      - name: Install site dependencies and generate static Nuxt site
        working-directory: site
        env:
          NUXT_APP_BASE_URL: /rodakos/
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm generate

      - name: Verify prerendered routes and static assets
        run: |
          test -f site/.output/public/.nojekyll
          test -f site/.output/public/index.html
          test -f site/.output/public/docs/getting-started/index.html
          test -f site/.output/public/docs/protocols/onboarding-index/index.html
          test -f site/.output/public/docs/aiot-protocol/binding-auth-and-security/index.html
          test -f site/.output/public/docs/realtime-voice/audio-rav1-vad-and-announce/index.html
          test -f site/.output/public/docs/advanced-guides/protocol-minimal-simulator/index.html
          test -f site/.output/public/protocols/index.html
          test -f site/.output/public/protocols/onboarding/index.html
          test -f site/.output/public/protocols/mqtt/index.html
          test -f site/.output/public/protocols/voice/index.html
          test -f site/.output/public/protocols/ota/index.html
          test -f site/.output/public/protocols/fixtures/index.html
          test -f site/.output/public/protocols/reference/index.html
          test -f site/.output/public/protocols/data/fixtures.json

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/.output/public

  deploy:
    name: Publish RodakOS Site to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
