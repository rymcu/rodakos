dependencies:
  # LVGL
  lvgl/lvgl: "9.3.0"
  esp_lvgl_port: "2.8.0~1"

  # Touch driver
  espressif/esp_lcd_touch_gt911: "1.2.0~3"

  # USB Mass Storage device mode
  espressif/esp_tinyusb: "2.1.1"

  # Board RGB LED control through RMT
  espressif/led_strip: "3.0.3"

  # JPEG decode for SD card photo rendering
  espressif/esp_new_jpeg: "0.6.1"

  # Audio codec playback through Board Manager audio_dac
  espressif/esp_codec_dev: "1.5.7"
  chmorgan/esp-libhelix-mp3: "1.0.3"

  # Voice cloud websocket transport
  espressif/esp_websocket_client: "1.8.0"

  # Embedded WebRTC peer connection for the BigSmart camera stream.
  # The component source is kept under components/esp_peer so the ESP32-S3
  # prebuilt peer implementation is selected by the local board target.
  espressif/esp_libsrtp: "^1.0.0"

  # Local custom wake-word detection and realtime Opus audio.
  espressif/esp-sr: "2.2.2"
  78/esp-opus: "1.0.5"
  78/esp-opus-encoder: "2.4.1"

  # ESP-IDF 6 moved MQTT and cJSON to managed components.
  espressif/mqtt: "1.0.0"
  espressif/cjson: "1.7.19~2"
  # Candidate discovery only; every service is authenticated with the USB TLS pin.
  espressif/mdns: "1.14.0"

  # Board Manager regenerates its conditional dependency set, so broad transitive ranges can
  # silently change the button/camera baseline when the generated component is recreated.
  espressif/button: "4.2.0"
  espressif/esp_video: "2.3.0"
  espressif/esp_sccb_intf: "0.0.8"
  espressif/tinyusb: "0.21.0~1"
  espressif/usb_host_uvc: "2.5.1"

  idf:
    version: "6.0.2"

# Board Manager and board-specific helper components live under local components/.
# ESP-IDF discovers and builds them from CMake dependencies.
