dependencies:
  # LVGL
  lvgl/lvgl: ~9.3.0
  esp_lvgl_port: ~2.6.0

  # 字体（普惠体中文 + Font Awesome 图标 + emoji），解决"豆腐块"显示问题
  # 参考 xiaozhi-esp32 的字体方案
  78/xiaozhi-fonts: ~1.6.0

  # Touch driver
  espressif/esp_lcd_touch_gt911: ~1.0.0

  # USB Mass Storage device mode
  espressif/esp_tinyusb: ~2.1.1

  # JPEG decode for SD card photo rendering
  espressif/esp_new_jpeg: ^0.6.1

  idf:
    version: ">=5.4.0"

